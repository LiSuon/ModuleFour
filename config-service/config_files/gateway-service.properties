server.port=8080

spring.application.name=gateway-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=user-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=CircuitBreaker=id:userServiceCB,fallbackUri:forward:/fallback/users

spring.cloud.gateway.server.webmvc.routes[1].id=notification-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=CircuitBreaker=id:notificationServiceCB,fallbackUri:forward:/fallback/notifications

spring.cloud.gateway.server.webmvc.default-filters[0]=AddRequestHeader=X-Gateway-Request,true

management.endpoints.web.exposure.include=health,info