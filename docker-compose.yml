version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: ModuleFour
    environment:
      POSTGRES_DB: ModuleFour_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

volumes:
  postgres_data:
